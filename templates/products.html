<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>body.bg-light { background:radial-gradient(ellipse at top left, rgba(37,99,235,.2), transparent 42%), linear-gradient(135deg,#0b1220 0%,#10233a 55%,#0f2f3b 100%); background-attachment:fixed; min-height:100vh; }</style></head>
<body class="bg-light"><nav class="navbar bg-dark navbar-dark px-3"><a href="/dashboard" class="btn btn-sm btn-light">Dashboard</a><a href="/stock/manage" class="btn btn-sm btn-light ms-2">Stock</a></nav>
<div class="container py-3"><div class="card p-3 mb-3"><h6>Add Product</h6><form method="post" action="/products/add" class="row g-2">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<input name="name" class="form-control col" placeholder="e.g. Incubator 528" required>
<input name="category" class="form-control col" placeholder="Category" required>
<input name="buy_price" type="number" class="form-control col" placeholder="Buy Price" required>
<input name="sell_price" type="number" class="form-control col" placeholder="Sell Price" required>
<button class="btn btn-dark col">Add</button></form></div></div></body></html>
