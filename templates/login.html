<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:radial-gradient(ellipse at top left, rgba(37,99,235,.25), transparent 42%), linear-gradient(135deg,#0b1220 0%,#10233a 55%,#0f2f3b 100%); background-attachment:fixed; min-height:100vh; color:#fff; margin:0; }
    .wrap { max-width:420px; margin:70px auto; padding:20px; background:rgba(0,0,0,0.25); border-radius:12px; }
    h1 { margin:0 0 18px; font-size:22px; }
    .field { margin:12px 0; }
    label { display:block; font-size:13px; margin-bottom:6px; color:#dbeafe; }
    input { width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.08); color:#fff; }
    button { width:100%; padding:12px; border-radius:10px; border:none; background:#2C7BE5; color:#fff; font-weight:700; cursor:pointer; }
    .flash { padding:10px 12px; border-radius:10px; margin:10px 0; font-size:14px; }
    .danger { background:#6B2737; border:1px solid rgba(255,255,255,0.15); }
    .success { background:#1B4332; border:1px solid rgba(255,255,255,0.15); }
    .small { font-size:12px; opacity:0.9; margin-top:10px; }
    .row { display:flex; gap:10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Secure Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ 'danger' if category=='danger' else 'success' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label>Username</label>
        <input name="username" autocomplete="username" required>
      </div>

      <div class="field">
        <label>PIN / Password</label>
        <input name="pin" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">Login</button>
      <div class="small">Use your assigned PIN to access the system.</div>
    </form>
  </div>
</body>
</html>
